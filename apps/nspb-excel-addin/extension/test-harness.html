<!DOCTYPE html>
<!-- DEV-ONLY TEST HARNESS — the real sidepanel UI served as a normal web page
     so browser automation can drive it (the real chrome-extension:// page is
     off-limits to other extensions). chrome.* APIs are stubbed below:
     · storage  → preloaded with the squarespace KB + Planning URL
     · runtime.sendMessage (navConsole/readScreen) → visibly stubbed
     Everything else (chat → real Worker, KB context, menus, chips) is REAL.
     Serve from repo root:  node tools/dev-server.js  → http://localhost:8123/extension/test-harness.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="sidepanel.css" />
  <title>NSPB AI — TEST HARNESS</title>
  <script>
    // ── chrome.* stubs (must run BEFORE sidepanel.js) ──────────────
    const __kbPromise = fetch("/clients/squarespace/tenant-kb.json")
      .then(r => r.json()).catch(() => null);
    window.chrome = {
      storage: { local: {
        get: async () => ({
          cfg: {
            planning: "https://nspb-squarespace.epm.us-ashburn-1.ocs.oraclecloud.com",
            user: "", pass: "", aiKey: "",
          },
          kb: await __kbPromise,
        }),
        set: async () => {},
      }},
      runtime: {
        sendMessage: async (m) => ({ ok: false, error: "(harness stub — '" + (m && m.type) + "' needs the real extension)" }),
      },
      tabs: { query: async () => [], update: async () => {}, create: async () => {} },
      windows: { update: async () => {} },
    };
  </script>
</head>
<body>
  <header class="hdr">
    <div class="brand">NSPB&nbsp;AI <span class="ver">TEST HARNESS</span></div>
    <div class="hdr-btns">
      <button id="menu-toggle" class="icon-btn" title="Menu — commands, forms, rules…">☰</button>
      <button id="settings-toggle" class="icon-btn" title="Settings">⚙</button>
    </div>
  </header>

  <section id="settings" class="settings hidden">
    <label>Planning URL (the real console)
      <input id="cfg-planning" type="text" placeholder="https://nspb-….oraclecloud.com" />
    </label>
    <div class="row2">
      <label>Username (optional)
        <input id="cfg-user" type="text" autocomplete="off" />
      </label>
      <label>Password (optional)
        <input id="cfg-pass" type="password" autocomplete="off" />
      </label>
    </div>
    <label>AI API key (optional)
      <input id="cfg-aikey" type="password" autocomplete="off"
             placeholder="leave empty to use the shared key" />
    </label>
    <label class="kb-row">Tenant KB (tenant-kb.json)
      <input id="cfg-kb-file" type="file" accept=".json" />
    </label>
    <div id="kb-status" class="kb-status">No KB imported.</div>
    <button id="cfg-save" class="primary">Save</button>
  </section>

  <section id="menu" class="menu hidden">
    <div class="menu-tabs">
      <button class="menu-tab active" data-tab="commands">Commands</button>
      <button class="menu-tab" data-tab="forms">Forms</button>
      <button class="menu-tab" data-tab="rules">Rules</button>
      <button class="menu-tab" data-tab="variables">Variables</button>
      <button class="menu-tab" data-tab="status">Status</button>
    </div>
    <input id="menu-filter" class="menu-filter" placeholder="Filter…" autocomplete="off" />
    <div id="menu-body" class="menu-body"></div>
  </section>

  <main id="log" class="log"></main>

  <div id="tip" class="tip" title="Click to try"></div>
  <div id="quickbar" class="quickbar"></div>

  <form id="composer" class="composer">
    <input id="input" type="text" autocomplete="off"
           placeholder="Ask anything, or: open form &lt;name&gt;" />
    <button id="send" type="submit">➤</button>
  </form>

  <script src="navmap.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
